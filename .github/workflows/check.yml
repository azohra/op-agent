name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run build:release
      - uses: actions/upload-artifact@v7
        with:
          name: op-agent-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7
