version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Vancouver"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    groups:
      routine:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Vancouver"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    groups:
      routine:
        update-types:
          - "minor"
          - "patch"
