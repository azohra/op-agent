version: 2

updates:
  - package-ecosystem: "gomod"
    labels: ["dependencies"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Vancouver"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      routine:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: "github-actions"
    labels: ["dependencies"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Vancouver"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      routine:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: chore
      include: scope
