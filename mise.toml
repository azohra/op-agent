[settings]
# The task artifact cache: a task whose inputs are unchanged replays its
# result instead of running again, on a laptop and on a runner alike.
experimental = true

# Shared inputs cover Go source and modules. The Go check also exercises
# the mise plugin, so it declares the Lua hooks and metadata as inputs.
[task_config]
global_inputs = ["mise.toml"]

[task_config.cache]
enabled = true
command_inputs = ["uname -sm"]

[task_config.input_groups]
go = ["**/*.go", "go.mod", "go.sum"]

[vars]
changelog_config = "https://gist.githubusercontent.com/azohra/2bf7f60736469fa8a81ffcb67214e572/raw/cliff.toml"

[tools]
go = "1.27.1"
"aqua:orhun/git-cliff" = "2.14.1"
goreleaser = "2.18.1"
# 8.30.1 can silently miss default rules; keep the last working release.
# https://github.com/gitleaks/gitleaks/issues/2170
gitleaks = "8.30.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

[tasks.format]
description = "Format Go source"
run = "gofmt -w ."

# Go's test cache cannot track the Lua files read by the mise subprocess.
[tasks.test]
description = "Run the test suite with the race detector"
run = "go test -race -count=1 ./..."

[tasks."check:go"]
description = "Formatting, vet and the race-detected test suite"
sources = ["@group:go", "hooks/**", "metadata.lua"]
outputs = []
run = """
#!/usr/bin/env bash
set -euo pipefail
test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
go vet ./...
go test -race -count=1 ./...
"""

# Reads the vulnerability database of the day; never cached.
[tasks."check:deps"]
description = "Known vulnerabilities"
run = "govulncheck ./..."

# Reads the working tree for secrets; never cached.
[tasks."check:secrets"]
description = "No secret in the tree"
run = "gitleaks dir --no-banner --redact ."

[tasks.check]
description = "The definition of green"
depends = ["check:go", "check:deps", "check:secrets"]

[tasks.build]
description = "Build op-agent for the current platform"
sources = ["@group:go"]
outputs = ["op-agent"]
run = "go build -trimpath -o op-agent ./cmd/op-agent"

[tasks.changelog]
description = "Render change history or export structured records"
usage = 'flag "--json" help="Export structured Git history"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "${usage_json:-false}" = true ]; then
  exec git cliff --config-url "{{vars.changelog_config}}" --context
fi
git cliff --config-url "{{vars.changelog_config}}"
'''

[tasks.dist]
description = "Build every release archive, the checksums and the cask into dist/ without publishing"
sources = ["@group:go", ".goreleaser.yaml", "LICENSE", "README.md"]
outputs = []
env = { HOMEBREW_TOOLS_TOKEN = "snapshot" }
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "Publish the release for the checked-out tag"
run = "goreleaser release --clean"

# What this repository needs in its environment, and which of those
# disclosure would compromise. Read it; do not restate it.
[tasks."env:contract"]
hide = true
description = "Every variable this repository needs, and whether it is a secret"
run = """
cat <<'CONTRACT'
secret  BOSUN_PRIVATE_KEY
secret  GITHUB_TOKEN
value   BOSUN_CLIENT_ID
CONTRACT
"""
