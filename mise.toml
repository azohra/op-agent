[tools]
go = "1.27.0"
goreleaser = "2.18.0"
# 8.30.1 can silently miss default rules; keep the last working release.
# https://github.com/gitleaks/gitleaks/issues/2170
gitleaks = "8.30.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

[tool_config]
locked = true

[tasks.format]
description = "Format Go source"
run = "gofmt -w ."

[tasks.test]
description = "Run the test suite with the race detector"
run = "go test -race ./..."

[tasks.check]
description = "Prove formatting, behavior, dependencies, and repository safety"
run = """
#!/usr/bin/env bash
set -euo pipefail
test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
go vet ./...
go test -race ./...
govulncheck ./...
goreleaser check
gitleaks dir --no-banner --redact .
"""

[tasks.build]
description = "Build op-agent for the current platform"
run = "go build -trimpath -o op-agent ./cmd/op-agent"

[tasks."build:release"]
description = "Build release archives and checksums without publishing"
depends = ["check"]
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "Build and publish the release tag at HEAD"
depends = ["check"]
usage = 'arg "<tag>" help="The release tag, e.g. v1.2.3"'
run = """
#!/usr/bin/env bash
set -euo pipefail

tag="${usage_tag:?release: a release tag is required}"
refuse() { echo "release: refusing — $*" >&2; exit 1; }

[[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || refuse "$tag is not a release tag"
[ -z "$(git status --porcelain)" ] || refuse "the tree is dirty"
origin="$(git remote get-url origin)"
case "$origin" in
  git@github.com:azohra/op-agent.git|https://github.com/azohra/op-agent|https://github.com/azohra/op-agent.git) ;;
  *) refuse "origin is not azohra/op-agent" ;;
esac
[ "$(git describe --tags --exact-match 2>/dev/null || true)" = "$tag" ] || refuse "$tag is not the tag at HEAD"
[ -n "${GITHUB_TOKEN:-}" ] || refuse "GITHUB_TOKEN is unset"

goreleaser release --clean
"""
